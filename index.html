    lines.push(`Видео без запаса: ${volumeText(result.videoTB)}`,
      `Запас: ${nf(result.reserve)}%`,
      `Объём видео с запасом: ${volumeText(result.plannedTB)}`);
    if (reverse) lines.push(`Установлено HDD: ${nf(result.totalCount,0)} × ${nf(result.disk)} ТБ`,
      `Доступно для записи: ${volumeText(result.availableTB)}`,
      `Расчётный срок: ${nf(result.retentionDays,4)} дня; основной результат округлён вниз до полного срока.`);
    else lines.push(
      result.raidActive ? `Уровень массива: ${C.raids[result.raidType].title}` : `Обычные диски: ${volumeText(result.requiredBeforeFsTB)}`,
      `Рекомендуемые HDD: ${nf(result.totalCount,0)} × ${nf(result.disk)} ТБ`,
      `Доступно для записи: ${volumeText(result.availableTB)}`,
      `Свободно после записи: ${volumeText(Math.max(0,result.availableTB-result.plannedTB))}`);
    lines.push(`Запись в сутки: ${volumeText(result.dailyTB)}`,
      `Поток при записи всех камер: ${nf(result.streamMbps)} Мбит/с`, '', 'ГРУППЫ КАМЕР');
    for (const r of result.groupResults) {
      const g = state.groups.find(g => g.id === r.id);
      lines.push(`${r.name}: ${r.count} камер, ${C.resolutionLabels[g.resolution] || g.resolution}, ${g.codec}, ${g.fps} к/с; сцена ${C.scenes[r.scene].label}; видеобитрейт ${nf(r.bitrateKbps,3)} кбит/с/камера; аудио ${nf(r.audio)} кбит/с/камера; ${nf(r.hours)} ч/сутки; ${g.motion ? 'активность ' + nf(r.activity * 100) + '%' : 'непрерывно'}${reverse ? '' : '; ' + r.days + ' дней'}.`);
    }

    if (result.warnings.length) lines.push('', 'ПРОВЕРЬТЕ: ' + result.warnings.join(' '));
    lines.push('', 'Рекомендуемый битрейт: табличное значение для поддерживаемых сочетаний, приближённая оценка для остальных. Битрейт уже включает сцену, повторно не корректируется. Ручной ввод — строго в кбит/с: 32 = 32 кбит/с, 4096 = 4096 кбит/с.',
      '1 ТБ = 10¹² байт. Сеть: без транспортных накладных расходов.');
    return lines.join('\n');
  }
  async function copyText(text, success) {
    try {
      if (!navigator.clipboard?.writeText) throw new Error('clipboard unavailable');
      await navigator.clipboard.writeText(text); toast(success);
    } catch {
      $('copy-text').value = text;
      $('copy-dialog').showModal();
      $('copy-text').focus(); $('copy-text').select();
    }
  }
  $('save-history').addEventListener('click',snapshotCurrent);
  $('export-history').addEventListener('click', () => {
    if (!savedCalculations.length) return;
    const rows = [['Дата','Объект','Камер','Режим','Результат, ТБ или дней','Группа','Количество в группе','Кодек','Разрешение, Мп','FPS','Сцена','Битрейт, кбит/с']];
    for (const entry of savedCalculations) {
      const r = calculateForView(entry.state);
      if (!r.valid) continue;
      const date = new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(new Date(entry.at));
      for (const groupResult of r.groupResults) {
        const g = entry.state.groups.find(x => x.id === groupResult.id);
        rows.push([date,entry.state.project,r.cameras,entry.state.mode === 'volume' ? 'По сроку' : 'По ёмкости',
          entry.state.mode === 'volume' ? r.targetTB.toFixed(3) : r.plannedDays,
          g.name,g.count,g.codec,g.resolution,g.fps,C.scenes[g.scene].label,groupResult.bitrateKbps]);
      }
    }
    const cell = v => '"'+String(v ?? '').replaceAll('"','""')+'"';
    const csv = '\uFEFF' + rows.map(row => row.map(cell).join(';')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const link = document.createElement('a'); link.href=url; link.download='istoriya-videoarhiva.csv';
    document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('История экспортирована в CSV');
  });
  $('clear-history').addEventListener('click', () => {
    if (!savedCalculations.length) return;
    $('clear-history-count').textContent = historyCountText(savedCalculations.length);
    $('clear-history-dialog').showModal();
  });
  for (const id of ['close-clear-history', 'cancel-clear-history']) {
    $(id).addEventListener('click', () => $('clear-history-dialog').close());
  }
  $('clear-history-dialog').addEventListener('click', event => {
    const dialog = $('clear-history-dialog');
    if (event.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close();
  });
  $('confirm-clear-history').addEventListener('click', () => {
    $('clear-history-dialog').close();
    if (!savedCalculations.length) return;
    const previous = savedCalculations;
    savedCalculations = [];
    if (!persistHistory()) { savedCalculations = previous; return; }
    undoState = undefined; undoHistory = previous;
    renderHistory(true);
    $('history-title').focus({preventScroll:true});
    toast('История очищена', true);
  });
  $('copy-result').addEventListener('click', () => { if (result.valid) copyText(reportText(), 'Расчёт скопирован'); });
  $('share-result').addEventListener('click', () => {
    if (!result.valid) return;
    const bytes = new TextEncoder().encode(JSON.stringify(state));
    const encoded = btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''));
    const url = location.origin + location.pathname + '#dssl-archive=' + encodeURIComponent(encoded);
    history.replaceState(null, '', url);
    copyText(url, 'Ссылка на расчёт скопирована');
  });
  $('print-result').addEventListener('click', () => {
    if (!result.valid) return;
    const rows = result.groupResults.map(r => {
      const g = state.groups.find(g => g.id === r.id);
      return `<tr><td>${esc(r.name)}</td><td>${r.count}</td><td>${esc(C.resolutionLabels[g.resolution] || g.resolution)}<br>${esc(g.codec)} / ${esc(g.fps)} к/с</td><td>${nf(r.bitrateKbps,3)} кбит/с<br>Сцена: ${C.scenes[r.scene].label}</td><td>${nf(r.hours)} ч/сутки<br>${g.motion ? nf(r.activity * 100) + '% активности' : 'Непрерывно'}</td><td>${state.mode === 'retention' ? durationText(result) : r.days}</td></tr>`;
    }).join('');
    $('print-report').innerHTML = `<h1>Расчёт видеоархива</h1><p>${new Intl.DateTimeFormat('ru-RU', { dateStyle: 'long' }).format(new Date())}</p><pre>${esc(reportText().split('ГРУППЫ КАМЕР')[0])}</pre><h2>Параметры групп</h2><table><thead><tr><th>Группа</th><th>Камер</th><th>Видеопоток</th><th>Битрейт / камера</th><th>Запись</th><th>Срок</th></tr></thead><tbody>${rows}</tbody></table>`;
    printReport($('print-report').innerHTML);
  });
  $('mobile-result').addEventListener('click', () => { $('result-card').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',block:'start'}); });
  if ('IntersectionObserver' in window) {
    const resultObserver = new IntersectionObserver(([entry]) => {
      $('mobile-result').classList.toggle('is-result-visible', entry.isIntersecting && entry.intersectionRatio >= .2);
    }, {threshold: [0, .2]});
    resultObserver.observe($('result-card'));
    cleanup.push(() => resultObserver.disconnect());
  }
  $('close-dialog').addEventListener('click', () => $('copy-dialog').close());
  $('copy-dialog').addEventListener('click', event => { if (event.target === $('copy-dialog')) $('copy-dialog').close(); });
  listenWindow('hashchange', () => {
    try {
      const shared = decodeHash();
      if (shared) { state = shared; expandedGroups.clear(); collapsedGroups.clear(); syncControls(); renderGroups(); update(); toast('Расчёт загружен из ссылки'); }
    } catch { toast('Не удалось прочитать расчёт из ссылки'); }
  });
  // Каждый обычный вход открывает пустой калькулятор. Сохранённые проекты
  // доступны отдельно через историю. Ссылка с параметрами — явное исключение.
  try {
    const shared = decodeHash();
    if (shared) state = shared;
  } catch { toast('Не удалось прочитать расчёт из ссылки'); }
  
  if (initialState) state = sanitize(initialState);
  savedCalculations = loadHistory();
  syncControls(); renderGroups(); update(); renderHistory();

  return {
    getState: () => JSON.parse(JSON.stringify(state)),
    getResult: () => JSON.parse(JSON.stringify(result)),
    load: raw => {
      state = sanitize(raw); expandedGroups.clear(); collapsedGroups.clear();
      clearHash(); syncControls(); renderGroups(); update();
    },
    dispose: () => {
      clearTimeout(toastTimer); clearTimeout(toastHideTimer);
      historyAnimation?.cancel();
      for (const dialog of document.querySelectorAll('dialog[open]')) dialog.close();
      for (const element of document.querySelectorAll('*')) for (const animation of element.getAnimations()) animation.cancel();
    }
  };

  }
  function followResultPanel(headerSelector) {
    const workspace = root.querySelector('.workspace');
    const column = root.querySelector('.results-column');
    const card = root.querySelector('#result-card');
    const headers = [...nativeDocument.querySelectorAll(headerSelector)];
    let frame = 0;

    column.setAttribute('data-scroll-follow', '');
    function schedule() {
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        const bounds = workspace.getBoundingClientRect();
        const columnBounds = column.getBoundingClientRect();
        const cardBounds = card.getBoundingClientRect();
        let headerBottom = 0;
        for (const header of headers) {
          const position = getComputedStyle(header).position;
          const rect = header.getBoundingClientRect();
          if ((position === 'fixed' || position === 'sticky') && rect.top <= 1 &&
              rect.bottom > headerBottom && rect.left < cardBounds.right && rect.right > cardBounds.left) {
            headerBottom = rect.bottom;
          }
        }
        const stripeOffset = cardBounds.top - columnBounds.top;
        const maxOffset = Math.max(0, bounds.height - columnBounds.height);
        const offset = Math.max(0, Math.min(headerBottom + 8 - bounds.top - stripeOffset, maxOffset));
        column.style.setProperty('--result-offset', `${offset}px`);
      });
    }
    listenWindow('scroll', schedule, {passive:true});
    listenWindow('resize', schedule);
    if ('ResizeObserver' in window) {
      const observer = new ResizeObserver(schedule);
      observer.observe(workspace);
      observer.observe(column);
      headers.forEach(header => observer.observe(header));
      cleanup.push(() => observer.disconnect());
    }
    cleanup.push(() => cancelAnimationFrame(frame));
    schedule();
  }
  let app;
  let restored = false;
  function restore({scroll=true}={}) {
    if (restored) return;
    restored = true;
    app?.dispose(); controller.abort();
    cleanup.forEach(dispose => dispose());
    host.remove();
    savedAttributes.forEach(({element,hidden,style}) => {
      if(hidden===null) element.removeAttribute('hidden'); else element.setAttribute('hidden',hidden);
      if(style===null) element.removeAttribute('style'); else element.setAttribute('style',style);
    });
    if (location.hash.startsWith('#dssl-archive=') && location.hash !== originalHash) {
      history.replaceState(null,'',location.pathname+location.search+originalHash);
    }
    if (window.DSSLArchiveDemo?.host === host) delete window.DSSLArchiveDemo;
    if (scroll) original.scrollIntoView({block:'start',behavior:'smooth'});
  }
  try {
    original.before(host);
    hiddenElements.forEach(element => {element.hidden=true;element.style.setProperty('display','none','important');});
    const hideScrollToTop = nativeDocument.createElement('style');
    hideScrollToTop.textContent = '#scrollToTop.scroll-to-top { display: none !important; }';
    nativeDocument.head.append(hideScrollToTop);
    cleanup.push(() => hideScrollToTop.remove());
    app = mount();
    followResultPanel('nav.js-menu');
    scope.getElementById('restore-original').addEventListener('click',() => restore(),{signal:controller.signal});
    const loadExample = () => app.load({...C.defaults(), project:'',groups:[{...C.defaultGroup(),count:'1',resolution:'r94197',fps:'25',codec:'H.264',scene:'medium',bitrate:'1920'}]});
    scope.getElementById('load-example').addEventListener('click',loadExample,{signal:controller.signal});
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(([entry]) => host.toggleAttribute('data-in-view',entry.isIntersecting));
      observer.observe(host); cleanup.push(() => observer.disconnect());
    } else host.setAttribute('data-in-view','');
    window.DSSLArchiveDemo = {version,baselineSha256:'abced4d49369f3a54b98b845d0ae6b35cb2363cee5e54be17ccd2cc3e487aeff',host,restore,getState:app.getState,getResult:app.getResult,loadExample};
    console.info('Калькулятор видеоархива: демоверсия готова.');
    // Standalone page keeps its introductory heading visible on load.
  } catch(error) {
    restore({scroll:false});
    original.textContent = 'Не удалось загрузить калькулятор. Обновите страницу или откройте её в современном браузере.';
    console.error('Ошибка запуска калькулятора',error);
  }
})();
</script></body></html>
